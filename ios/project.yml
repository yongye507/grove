name: Grove
options:
  bundleIdPrefix: com.grove
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions:
    - en
    - Base
    - zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Grove
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # Portrait-only phone app: opt out of iPad multitasking so Asc doesn't require all 4 orientations.
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_NSUserNotificationsUsageDescription: Grove notifies you when a focus session ends.
    PRODUCT_BUNDLE_IDENTIFIER: com.grove.focus
targets:
  Grove:
    type: application
    platform: iOS
    sources:
      - path: Grove
        excludes:
          - README.md
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grove.focus
        PRODUCT_NAME: Grove
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FH4DFRTFXF
    scheme:
      testTargets: []
      gatherCoverageData: false
      storeKitConfiguration: Grove/Resources/Products.storekit
